[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.0.6"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/angeldqr/solace"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
