[package]
name = "solace-app"
description = "Solace desktop app: Tauri composition root"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Distinct lib name avoids a bin/lib name clash on Windows (cargo#8519).
name = "solace_app_lib"
# Desktop only: staticlib/cdylib are for iOS/Android and cost ~1 GB per build of the app.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
getrandom = "0.4"
notify = "9"
log = "0.4"
serde.workspace = true
serde_json.workspace = true
solace-core = { path = "../crates/solace-core" }
solace-infra = { path = "../crates/solace-infra" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
