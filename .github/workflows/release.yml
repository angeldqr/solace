name: Release

on:
  push:
    # Numeric versions only: WiX (MSI) rejects non-numeric pre-release suffixes.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # A manual run builds every platform without releasing anything, to try the bundles out.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Signing happens only once SignPath is set up (docs/code-signing.md).
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    # The updater key is given only to the two steps that sign updates, never to install, test or
    # build steps where a compromised dependency could read it.
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match the workspace version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != v${version}"; exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci
      - run: pnpm test
      - run: pnpm build
      # tauri-build checks that the bundled CLI exists before compiling the app.
      - run: node scripts/build-cli.mjs
      # Never ship a tag whose tests fail or whose Cargo.lock is stale.
      - run: cargo test --locked --workspace

      - run: pnpm tauri build --no-bundle
      # The CLI is signed before bundling so the installers carry the signed copy. Solace.exe is
      # not: `tauri bundle` rewrites a marker inside it per installer type, which would void a
      # signature made before. The installers themselves are signed below.
      - name: Collect the CLI to sign
        if: env.SIGN == 'true'
        shell: bash
        run: mkdir -p to-sign/programs && cp src-tauri/binaries/solace.exe to-sign/programs/
      - uses: actions/upload-artifact@v7
        id: programs
        if: env.SIGN == 'true'
        with:
          name: unsigned-programs
          path: to-sign/programs
      - uses: signpath/github-action-submit-signing-request@v3
        if: env.SIGN == 'true'
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: solace
          signing-policy-slug: release-signing
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.programs.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          output-artifact-directory: signed/programs
          # Each request waits for the owner's manual approval in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
      - name: Use the signed CLI
        if: env.SIGN == 'true'
        shell: bash
        run: cp signed/programs/solace.exe src-tauri/binaries/solace.exe

      - run: pnpm tauri bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Collect installers to sign
        if: env.SIGN == 'true'
        shell: bash
        run: |
          mkdir -p to-sign/installers
          cp target/release/bundle/nsis/*-setup.exe target/release/bundle/msi/*.msi to-sign/installers/
      - uses: actions/upload-artifact@v7
        id: installers
        if: env.SIGN == 'true'
        with:
          name: unsigned-installers
          path: to-sign/installers
      - uses: signpath/github-action-submit-signing-request@v3
        if: env.SIGN == 'true'
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: solace
          signing-policy-slug: release-signing
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.installers.outputs.artifact-id }}
          output-artifact-directory: signed/installers
          wait-for-completion-timeout-in-seconds: 3600
      - name: Use the signed installers and re-sign them for the updater
        if: env.SIGN == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cp signed/installers/*-setup.exe target/release/bundle/nsis/
          cp signed/installers/*.msi target/release/bundle/msi/
          # Authenticode changed the bytes, so the updater signatures must be made again.
          for f in target/release/bundle/nsis/*-setup.exe target/release/bundle/msi/*.msi; do
            pnpm tauri signer sign "$f"
          done

      - name: Collect the release files
        shell: bash
        run: |
          mkdir release
          cp target/release/bundle/nsis/*-setup.exe target/release/bundle/nsis/*-setup.exe.sig \
            target/release/bundle/msi/*.msi target/release/bundle/msi/*.msi.sig release/
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release

  unix:
    strategy:
      matrix:
        include:
          # The oldest hosted Ubuntu: an AppImage runs on distributions at least as new as its
          # build machine.
          - os: ubuntu-22.04
            name: linux
          # Apple Silicon only; Intel Macs are not built.
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: version
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Linux libraries Tauri builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/build-cli.mjs
      - run: cargo test --locked --workspace
      - run: pnpm tauri build --no-bundle
      # As on Windows, only the bundling step sees the updater key.
      - run: pnpm tauri bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Collect the release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release
          if [ "$RUNNER_OS" = Linux ]; then
            cp target/release/bundle/appimage/*.AppImage target/release/bundle/appimage/*.AppImage.sig \
              target/release/bundle/deb/*.deb release/
          else
            cp target/release/bundle/dmg/*.dmg release/
            # The updater bundle has no version in its name; every release needs a distinct one.
            cp target/release/bundle/macos/Solace.app.tar.gz "release/Solace_${VERSION}_aarch64.app.tar.gz"
            cp target/release/bundle/macos/Solace.app.tar.gz.sig "release/Solace_${VERSION}_aarch64.app.tar.gz.sig"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: release

  publish:
    needs: [windows, unix]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Write latest.json
        run: node scripts/release-manifest.mjs "${GITHUB_REF_NAME#v}" release release/latest.json
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A draft left by a failed earlier run is replaced; a published release never is.
          if [ "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "${GITHUB_REF_NAME}" --yes
          fi
          gh release create "${GITHUB_REF_NAME}" --draft --title "Solace ${GITHUB_REF_NAME}" \
            --notes "Windows: \`Solace_*_x64-setup.exe\`. macOS (Apple Silicon): \`.dmg\`. Linux: \`.AppImage\` or \`.deb\`." \
            release/*
