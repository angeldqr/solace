name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci
      - run: pnpm test
      - run: pnpm build
      # Known vulnerabilities in what ships; dev-only tooling is not bundled.
      - run: pnpm audit --prod

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Vulnerabilities fail the build; "unmaintained" warnings only report.
      - run: cargo audit

  core:
    # Keeps the domain crate portable and free of OS/UI dependencies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: solace-core must not depend on tauri, pty or windows crates
        run: |
          set -o pipefail
          deps=$(cargo tree --locked -p solace-core -e normal --target all --prefix none)
          if grep -E "tauri|portable-pty|windows" <<<"$deps"; then
            echo "::error::solace-core gained an infrastructure dependency"; exit 1
          fi
      - run: cargo test --locked -p solace-core

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux libraries Tauri builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! embeds ../dist, so the frontend must be built first.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # tauri-build checks that the bundled CLI exists before compiling the app.
      - run: node scripts/build-cli.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
