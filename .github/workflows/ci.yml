name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci
      - run: pnpm test
      - run: pnpm build

  core:
    # Keeps the domain crate portable and free of OS/UI dependencies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: solace-core must not depend on tauri, pty or windows crates
        run: |
          set -o pipefail
          deps=$(cargo tree --locked -p solace-core -e normal --target all --prefix none)
          if grep -E "tauri|portable-pty|windows" <<<"$deps"; then
            echo "::error::solace-core gained an infrastructure dependency"; exit 1
          fi
      - run: cargo test --locked -p solace-core

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! embeds ../dist, so the frontend must be built first.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # tauri-build checks that the bundled CLI exists before compiling the app.
      - run: node scripts/build-cli.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
