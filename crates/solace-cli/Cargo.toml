[package]
name = "solace-cli"
description = "The solace command: lets agents drive the Solace workspace they run in."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "solace"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
interprocess = "2.4"
serde_json.workspace = true
solace-core = { path = "../solace-core" }
solace-infra = { path = "../solace-infra" }
