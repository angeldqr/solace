[package]
name = "solace-infra"
description = "Solace adapters: PTYs, persistence, git."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ignore = "0.4"
interprocess = "2.4"
notify = "9"
portable-pty = "0.9"
rusqlite = { version = "0.43", features = ["bundled"] }
solace-core = { path = "../solace-core" }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
vt100 = "0.18"
serde.workspace = true
serde_json.workspace = true
which = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
